services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bureau
      POSTGRES_USER: bureau
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bureau}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bureau"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://bureau:${POSTGRES_PASSWORD:-bureau}@db:5432/bureau
      APP_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
